<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulário de Bem-Estar - Carpe Diem</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c795b5">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <link rel="stylesheet" href="formulario.css">
</head>
<body>
  <div class="page-layout">

    <aside class="sidebar">
      <img src="img/logo.png" alt="Carpe Diem" class="sidebar-logo">
      <nav class="sidebar-nav">
        <a href="index.html"><i class="fa-solid fa-house"></i></a>
        <a href="calendario.html"><i class="fa-solid fa-calendar-days"></i></a>
        <a href="formulario.html"><i class="fa-solid fa-file-lines"></i></a>
        <a href="perfil.html"><i class="fa-solid fa-user"></i></a>
      </nav>
    </aside>


    <main class="main-content">
      <div class="container">

        <img src="img/logo.png" alt="Carpe Diem" class="logo-mobile">

        <h1>Formulário de bem-estar</h1>

        <div class="cards-grid">

          <div class="form-group">
            <label class="question-header">Como está a tua energia emocional hoje?</label>
            <div class="options-container">
              <label class="btn-option">
                <input type="radio" name="energia"> Elevada: Sinto-me com força e motivação.
              </label>
              <label class="btn-option">
                <input type="radio" name="energia"> Equilibrada: Sinto-me bem, num ritmo normal.
              </label>
              <label class="btn-option">
                <input type="radio" name="energia"> Baixa: Sinto-me sem energia ou cansado(a).
              </label>
              <label class="btn-option">
                <input type="radio" name="energia"> Esgotada: Sinto-me no limite ou sobrecarregado(a).
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="question-header">Como foi seu sono?</label>
            <div class="options-container">
              <label class="btn-option">
                <input type="radio" name="sono"> Repousante
              </label>
              <label class="btn-option">
                <input type="radio" name="sono"> Razoável
              </label>
              <label class="btn-option">
                <input type="radio" name="sono"> Agitado
              </label>
              <label class="btn-option">
                <input type="radio" name="sono"> Insuficiente
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="question-header">Que tipo de apoio precisas hoje?</label>
            <div class="options-container">
              <label class="btn-option">
                <input type="radio" name="apoio"> "Preciso de avançar com tarefas pequenas."
              </label>
              <label class="btn-option">
                <input type="radio" name="apoio"> "Preciso de pausas e descanso."
              </label>
              <label class="btn-option">
                <input type="radio" name="apoio"> "Preciso apenas de manter a rotina básica."
              </label>
              <label class="btn-option">
                <input type="radio" name="apoio"> "Não quero fazer nada."
              </label>
            </div>
          </div>
        </div>

        <a href="index.html" class="btn-submit">Ok</a>
      </div>
    </main>
  </div>

  <nav class="bottom-nav">
    <a href="index.html"><i class="fa-solid fa-house"></i></a>
    <a href="calendario.html"><i class="fa-solid fa-calendar-days"></i></a>
    <a href="formulario.html"><i class="fa-solid fa-file-lines"></i></a>
    <a href="perfil.html"><i class="fa-solid fa-user"></i></a>
  </nav>
  </div>
</body>
</html>
