<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informações do Usuário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="img/logo.png" alt="Carpe Diem" class="logo-small">

    <h2>ANTES DE COMEÇARMOS, TEMOS ALGUMAS PERGUNTAS IMPORTANTES</h2>

    <div class="form-group">
      <label>Como gostaria de ser chamad@?</label>
      <input type="text" id="username" placeholder="Digite aqui">
    </div>

    <div class="form-group">
      <label>Em qual período do dia você está na escola?</label>
      <select id="school-period">
        <option value="" disabled selected>Selecione o período</option>
        <option value="manha">Manhã</option>
        <option value="tarde">Tarde</option>
        <option value="noite">Noite</option>
        <option value="integral">Integral (Manhã e Tarde)</option>
        <option value="misto">Misto (Tarde e Noite)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Defina quantas horas serão destinadas ao sono:</label>
      <input type="number" id="sleep-hours" placeholder="Ex: 8" min="1" max="24" oninput="limparErroSono()">

      <span id="sono-info" class="duration-display"></span>
    </div>

    <button class="btn-submit" onclick="salvarDados()">Continuar</button>
  </div>

  <div class="modal-overlay" id="modal-aviso">
    <div class="modal-box">
      <h3 id="modal-titulo">🌙 Descanso é essencial!</h3>
      <p id="modal-texto">Mensagem de aviso aqui.</p>
      <button class="modal-btn" onclick="fecharModal()">Ajustar sono</button>
    </div>
  </div>

  <script>
    function mostrarModal(titulo, texto) {
      document.getElementById('modal-titulo').textContent = titulo;
      document.getElementById('modal-texto').textContent = texto;
      document.getElementById('modal-aviso').classList.add('show');
    }

    function fecharModal() {
      document.getElementById('modal-aviso').classList.remove('show');
      document.getElementById('sleep-hours').focus();
    }

    function limparErroSono() {
      document.getElementById('sleep-hours').classList.remove('input-error');
    }

    function salvarDados() {
      const nome = document.getElementById('username').value;
      const periodo = document.getElementById('school-period').value;
      const sonoInput = document.getElementById('sleep-hours');
      const sono = parseFloat(sonoInput.value);

      if (!nome || !periodo || isNaN(sono)) {
        alert('Por favor, preencha todos os campos antes de continuar.');
        return;
      }

      if (sono < 7) {
        sonoInput.classList.add('input-error');
        mostrarModal("😴 O descanso faz parte da aprovação!", "Definimos o mínimo de 7 horas de sono para garantir que sua mente esteja descansada e com boa retenção de conteúdo. Por favor, ajuste suas horas de sono.");
        return;
      }

      localStorage.setItem('carpeDiem_nome', nome);
      localStorage.setItem('carpeDiem_periodo', periodo);
      localStorage.setItem('carpeDiem_sono', sono);

      window.location.href = 'adicionar_tarefa.html';
    }
  </script>
</body>
</html>
