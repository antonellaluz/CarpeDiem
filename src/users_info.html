<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Informações do Usuário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#c795b5">
  <link rel="apple-touch-icon" href="img/icon-192.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <img src="img/logo.png" alt="Carpe Diem" class="logo-small">

    <h2>ANTES DE COMEÇARMOS, TEMOS ALGUMAS PERGUNTAS IMPORTANTES</h2>

    <div class="form-group">
      <label>Como gostaria de ser chamad@?</label>
      <input type="text" id="username" placeholder="Digite aqui">
    </div>

    <div class="form-group">
      <label>Em qual período do dia você está na escola?</label>
      <select id="school-period">
        <option value="" disabled selected>Selecione o período</option>
        <option value="manha">Manhã</option>
        <option value="tarde">Tarde</option>
        <option value="noite">Noite</option>
        <option value="integral">Integral (Manhã e Tarde)</option>
        <option value="misto">Misto (Tarde e Noite)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Defina quantas horas serão destinadas ao sono:</label>
      <input
        type="text"
        id="sleep-hours"
        placeholder="Ex: 8"
        inputmode="decimal"
        maxlength="5"
        autocomplete="off"
      >

      <span id="sono-info" class="duration-display"></span>
    </div>

    <button class="btn-submit" onclick="salvarDados()">Continuar</button>
  </div>

  <div class="modal-overlay" id="modal-aviso">
    <div class="modal-box">
      <h3 id="modal-titulo">🌙 Descanso é essencial!</h3>
      <p id="modal-texto">Mensagem de aviso aqui.</p>
      <button class="modal-btn" onclick="fecharModal()">Ajustar sono</button>
    </div>
  </div>
 <script src="ui.js"></script>
  <script>
    const SONO_MINIMO = 7;
    const SONO_MAXIMO = 24;

    const sonoInput = document.getElementById('sleep-hours');

    function mostrarModal(titulo, texto) {
      document.getElementById('modal-titulo').textContent = titulo;
      document.getElementById('modal-texto').textContent = texto;
      document.getElementById('modal-aviso').classList.add('show');
    }

    function fecharModal() {
      document.getElementById('modal-aviso').classList.remove('show');
      sonoInput.focus();
    }

    function limparErroSono() {
      sonoInput.classList.remove('input-error');
    }

    // Converte o texto do campo em número (aceita vírgula ou ponto)
    function lerSono() {
      return parseFloat(sonoInput.value.replace(',', '.'));
    }

    // Filtra o que é digitado: só números e um separador decimal, nunca acima de 24
    sonoInput.addEventListener('input', function () {
      limparErroSono();

      // Remove tudo que não for número, vírgula ou ponto
      let valor = this.value.replace(/[^0-9.,]/g, '');

      // Mantém apenas um separador decimal
      const partes = valor.split(/[.,]/);
      if (partes.length > 2) {
        valor = partes[0] + ',' + partes.slice(1).join('');
      }

      // Limita a uma casa decimal (ex: 7,5)
      const sep = valor.search(/[.,]/);
      if (sep !== -1) {
        valor = valor.slice(0, sep + 2);
      }

      // Se passar do máximo, trava no máximo
      const numero = parseFloat(valor.replace(',', '.'));
      if (!isNaN(numero) && numero > SONO_MAXIMO) {
        valor = String(SONO_MAXIMO);
      }

      this.value = valor;
    });

    function salvarDados() {
      const nome = document.getElementById('username').value.trim();
      const periodo = document.getElementById('school-period').value;
      const sono = lerSono();

      if (!nome || !periodo || isNaN(sono)) {
        mostrarModal("⚠️ Campos obrigatórios", "Por favor, preencha todos os campos antes de continuar.");
        return;
      }

      if (sono > SONO_MAXIMO) {
        sonoInput.classList.add('input-error');
        mostrarModal("⏰ Um dia tem só 24 horas!", "O limite máximo de horas de sono é " + SONO_MAXIMO + ". Por favor, ajuste o valor.");
        return;
      }

      if (sono < SONO_MINIMO) {
        sonoInput.classList.add('input-error');
        mostrarModal("😴 O descanso faz parte da aprovação!", "Definimos o mínimo de " + SONO_MINIMO + " horas de sono para garantir que sua mente esteja descansada e com boa retenção de conteúdo. Por favor, ajuste suas horas de sono.");
        return;
      }

      localStorage.setItem('carpeDiem_nome', nome);
      localStorage.setItem('carpeDiem_periodo', periodo);
      localStorage.setItem('carpeDiem_sono', sono);

      window.location.href = 'adicionar_tarefa.html';
    }
  </script>
</body>
</html>
