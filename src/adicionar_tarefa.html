<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar Tarefa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>ADICIONAR TAREFA</h1>

        <div class="form-group">
            <label>Nome da tarefa:</label>
            <input type="text" id="task-name" placeholder="ex: Estudar matemática">
        </div>

        <div class="form-group">
            <label>Tipo de Tarefa:</label>
            <div class="tipo-container">
                <button type="button" class="tipo-btn active" id="btn-variavel" onclick="setTipo('variavel')">Variável (Máx 2h)</button>
                <button type="button" class="tipo-btn" id="btn-fixa" onclick="setTipo('fixa')">Fixa (Livre)</button>
            </div>
        </div>

        <div class="form-group">
            <label>Data:</label>
            <input type="date" id="task-date">
        </div>

        <div class="row-group">
            <div class="form-group">
                <label>Início:</label>
                <input type="time" id="task-start" step="60" oninput="calcularDuracao()">
            </div>
            <div class="form-group">
                <label>Término:</label>
                <input type="time" id="task-end" step="60" oninput="calcularDuracao()">
            </div>
        </div>

        <span id="duration-info" class="duration-display"></span>

        <div id="estudo-campos">
            <div class="form-group">
                <label>Matéria:</label>
                <select id="task-subject" onchange="atualizarAssuntos()">
                    <option value="" disabled selected>Selecione a matéria</option>
                </select>
            </div>

            <div class="form-group">
                <label>Assunto:</label>
                <select id="task-topic">
                    <option value="" disabled selected>Selecione o assunto</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Cor da Tarefa:</label>
            <div class="color-picker-container">
                <div class="color-circle" style="background-color: #c795b5;" onclick="selecionarCor('#c795b5', this)"></div>
                <div class="color-circle" style="background-color: #a78bfa;" onclick="selecionarCor('#a78bfa', this)"></div>
                <div class="color-circle" style="background-color: #60a5fa;" onclick="selecionarCor('#60a5fa', this)"></div>
                <div class="color-circle" style="background-color: #4ade80;" onclick="selecionarCor('#4ade80', this)"></div>
                <div class="color-circle" style="background-color: #fde047;" onclick="selecionarCor('#fde047', this)"></div>
                <div class="color-circle" style="background-color: #f87171;" onclick="selecionarCor('#f87171', this)"></div>
                <input type="color" id="task-color-custom" value="#c795b5" onchange="selecionarCorCustom(this.value)" title="Outra cor">
            </div>
        </div>

        <button class="btn-submit" onclick="salvarTarefa()">Ok</button>
    </div>

    <!-- Modal de Aviso -->
    <div class="modal-overlay" id="modal-aviso">
        <div class="modal-box">
            <h3 id="modal-titulo">⚠️ Calma lá, vestibulando!</h3>
            <p id="modal-texto">Mensagem de aviso aqui.</p>
            <button class="modal-btn" onclick="focarCampoErro()">Alterar informação</button>
        </div>
    </div>

    <script>
        const materiasAssuntos = {
        "Matemática": ["Funções", "Geometria Plana", "Probabilidade", "Matrizes"],
        "Física": ["Cinemática", "Dinâmica", "Termologia", "Óptica"],
        "Química": ["Estequiometria", "Termoquímica", "Eletroquímica", "Química Orgânica"],
        "Biologia": ["Citologia", "Genética", "Ecologia", "Fisiologia Humana"],
        "Português": ["Crase", "Análise Sintática", "Figuras de Linguagem", "Modernismo"]
    };

    let tipoAtual = 'variavel';
    let corSelecionada = '#c795b5';

    window.addEventListener('DOMContentLoaded', () => {
        const subjectSelect = document.getElementById('task-subject');
        if (subjectSelect) {
            for (let materia in materiasAssuntos) {
                let option = document.createElement('option');
                option.value = materia;
                option.textContent = materia;
                subjectSelect.appendChild(option);
            }
        }
    });

    function atualizarAssuntos() {
        const materiaSelecionada = document.getElementById('task-subject').value;
        const topicSelect = document.getElementById('task-topic');
        if (!topicSelect) return;

        topicSelect.innerHTML = '<option value="" disabled selected>Selecione o assunto</option>';

        if (materiasAssuntos[materiaSelecionada]) {
            materiasAssuntos[materiaSelecionada].forEach(assunto => {
                let option = document.createElement('option');
                option.value = assunto;
                option.textContent = assunto;
                topicSelect.appendChild(option);
            });
        }
    }

    function setTipo(tipo) {
        tipoAtual = tipo;
        ['variavel', 'fixa', 'lembrete'].forEach(t => {
            const btn = document.getElementById(`btn-${t}`);
            if (btn) btn.classList.toggle('active', tipo === t);
        });

        const estudoCampos = document.getElementById('estudo-campos');
        if (estudoCampos) {
            if (tipo === 'fixa' || tipo === 'lembrete') {
                estudoCampos.style.display = 'none';
            } else {
                estudoCampos.style.display = 'block';
            }
        }

        calcularDuracao();
    }

    function selecionarCor(hex, elemento) {
        corSelecionada = hex;
        document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
        if (elemento) elemento.classList.add('selected');
    }

    function selecionarCorCustom(hex) {
        corSelecionada = hex;
        document.querySelectorAll('.color-circle').forEach(c => c.classList.remove('selected'));
    }

    function calcularDuracao() {
        const horaInicio = document.getElementById('task-start').value;
        const horaFim = document.getElementById('task-end').value;
        const display = document.getElementById('duration-info');
        const inputFim = document.getElementById('task-end');

        if (!display || !inputFim) return 0;

        if (!horaInicio || !horaFim) {
            display.textContent = '';
            inputFim.classList.remove('input-error');
            display.classList.remove('error-text');
            return 0;
        }

        const [hI, mI] = horaInicio.split(':').map(Number);
        const [hF, mF] = horaFim.split(':').map(Number);

        let minutosTotais = (hF * 60 + mF) - (hI * 60 + mI);

        if (minutosTotais <= 0) {
            display.textContent = 'O horário de término deve ser posterior ao início.';
            display.classList.add('error-text');
            inputFim.classList.add('input-error');
            return -1;
        }

        const horas = Math.floor(minutosTotais / 60);
        const minutos = minutosTotais % 60;
        let textoDuracao = 'Duração: ';

        if (horas > 0) textoDuracao += `${horas}h `;
        if (minutos > 0) textoDuracao += `${minutos}min`;

        const horasDecimais = minutosTotais / 60;

        if (tipoAtual === 'variavel' && horasDecimais > 2) {
            display.textContent = `${textoDuracao} — Excede o limite de 2h!`;
            display.classList.add('error-text');
            inputFim.classList.add('input-error');
        } else {
            display.textContent = textoDuracao;
            display.classList.remove('error-text');
            inputFim.classList.remove('input-error');
        }

        return horasDecimais;
    }

    function mostrarModal(titulo, texto) {
        const modalTitulo = document.getElementById('modal-titulo');
        const modalTexto = document.getElementById('modal-texto');
        const modalAviso = document.getElementById('modal-aviso');

        if (modalTitulo) modalTitulo.textContent = titulo;
        if (modalTexto) modalTexto.textContent = texto;
        if (modalAviso) modalAviso.classList.add('show');
        else alert(`${titulo}\n\n${texto}`);
    }

    function focarCampoErro() {
        const modalAviso = document.getElementById('modal-aviso');
        if (modalAviso) modalAviso.classList.remove('show');
        const inputFim = document.getElementById('task-end');
        if (inputFim) inputFim.focus();
    }

    function salvarTarefa(event) {
        if (event) event.preventDefault();

        const titulo = document.getElementById('task-name').value;
        const dataInput = document.getElementById('task-date') ? document.getElementById('task-date').value : '';
        const duracaoHoras = calcularDuracao();
        let campoParaAlterar = "";

        if (!titulo || !dataInput) {
            mostrarModal("⚠️ Campos obrigatórios", "Você precisa preencher o Título e selecionar uma Data válida.");
            return;
        }

        if (duracaoHoras <= 0) {
            mostrarModal("⚠️ Horário Inválido", "O horário de término está incorreto. Por favor, ajuste o campo de Horário de Término.");
            return;
        }

        if (dataInput) {
            const dataObj = new Date(dataInput + 'T00:00:00');
            const diaSemana = dataObj.getDay();
            if (diaSemana === 0 && tipoAtual === 'variavel') {
                mostrarModal("⚠️ Ação não permitida", "Você não pode agendar tarefas variáveis aos domingos. Apenas tarefas fixas são permitidas");
                return;
            }
        }

        if (tipoAtual === 'variavel' && duracaoHoras > 2) {
            mostrarModal("⚠️ Calma lá, vestibulando!", "Percebemos que você agendou mais de 2 horas seguidas para estudar, isso reduz sua retenção de conteúdo e aumenta o cansaço visual e mental.");
            return;
        }

        const novaTarefa = {
            titulo,
            tipo: tipoAtual,
            data: dataInput,
            horaInicio: document.getElementById('task-start').value,
            horaFim: document.getElementById('task-end').value,
            cor: corSelecionada,
            materia: tipoAtual === 'variavel' ? document.getElementById('task-subject').value : null,
            assunto: tipoAtual === 'variavel' ? document.getElementById('task-topic').value : null
        };

        let tarefas = JSON.parse(localStorage.getItem('carpeDiem_tarefas')) || [];
        tarefas.push(novaTarefa);
        localStorage.setItem('carpeDiem_tarefas', JSON.stringify(tarefas));

        alert("Tarefa salva com sucesso!");

        window.location.href = 'calendario.html';
    }
    </script>
</body>
</html>
